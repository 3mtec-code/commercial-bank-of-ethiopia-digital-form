name: cbe_digital_form
description: Commercial Bank of Ethiopia - Digital Banking Form Service
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Encryption
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.3

  # Signature Pad
  signature: ^5.4.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # fonts:
